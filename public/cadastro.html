<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsychoAssociation | Cadastro</title>
  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <script src="./js/sessao.js"></script>
  <script src="./js/funcoes.js"></script>
  <link rel="icon" type="image/x-icon" href="assets/icon/psycho-association-logo.svg">
</head>

<body>
  <div class="image">
    <a href="index.html"><img src="assets/icon/psycho-association-outline-roxo.svg"></a>
  </div>
  <div class="left-container">
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
    <div class="content">
      <div class="texts">
        <h2>SEJA BEM-VINDO</h2>
        <h3>FAÇA PARTE DA ORGANIZAÇÃO</h3>
      </div>
      <div class="form-container">
        <div class="input-container">
          <label for="ipt_name">Nome do usuário</label>
          <input type="text" id="ipt_name" placeholder="Insira seu nome de usuário">
        </div>
        <div class="input-container">
          <label for="ipt_email">Email</label>
          <input type="text" id="ipt_email" placeholder="Insira seu endereço de email">
        </div>
        <div class="input-container">
          <label for="ipt_password">Senha</label>
          <div class="password-input-wrapper">
            <input type="password" id="ipt_password" placeholder="Insira sua senha">
            <button type="button" class="toggle-password" aria-label="Mostrar senha"
              onclick="alternarVisibilidadeSenha(this, 'ipt_password')">
              <i class="material-icons">visibility</i>
            </button>
          </div>
        </div>
        <div class="input-container">
          <label for="ipt_password_confirmed">Confirmar senha</label>
          <div class="password-input-wrapper">
            <input type="password" id="ipt_password_confirmed" placeholder="Insira sua senha novamente">
            <button type="button" class="toggle-password" aria-label="Mostrar senha"
              onclick="alternarVisibilidadeSenha(this, 'ipt_password_confirmed')">
              <i class="material-icons">visibility</i>
            </button>
          </div>
        </div>
        <button onclick="cadastrar()">CADASTRAR-SE</button>
      </div>
      <p>Já tem uma conta? <a href="login.html"><span>Faça login</span></a></p>
    </div>
  </div>
  <div class="right-container">
  </div>
</body>

</html>

<script>
  function alternarVisibilidadeSenha(botao, idInput) {
    const input = document.getElementById(idInput);
    const icone = botao.querySelector('i');
    const senhaOculta = input.type === 'password';

    input.type = senhaOculta ? 'text' : 'password';
    icone.textContent = senhaOculta ? 'visibility_off' : 'visibility';
    botao.setAttribute('aria-label', senhaOculta ? 'Ocultar senha' : 'Mostrar senha');
  }

  function limparErrosCadastro() {
    const mensagensErro = document.querySelectorAll('.input-error-message');
    const inputsComErro = document.querySelectorAll('.input-container input.error');

    mensagensErro.forEach((mensagem) => mensagem.remove());
    inputsComErro.forEach((input) => input.classList.remove('error'));
  }

  function exibirErroCampo(inputElement, mensagem) {
    inputElement.classList.add('error');

    const inputContainer = inputElement.closest('.input-container');
    let spanErro = inputContainer.querySelector('.input-error-message');
    if (!spanErro) {
      spanErro = document.createElement('span');
      spanErro.classList.add('input-error-message');
      inputContainer.appendChild(spanErro);
    }

    spanErro.textContent = mensagem;
  }

  function emailValido(email) {
    const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return regexEmail.test(email);
  }

  function cadastrar() {
    const nomeInput = document.getElementById('ipt_name');
    const emailInput = document.getElementById('ipt_email');
    const senhaInput = document.getElementById('ipt_password');
    const confirmarSenhaInput = document.getElementById('ipt_password_confirmed');

    const nomeVar = nomeInput.value.trim();
    const emailVar = emailInput.value.trim();
    const senhaVar = senhaInput.value;
    const confirmacaoSenhaVar = confirmarSenhaInput.value;

    let message = '';
    let formularioValido = true;
    let primeiroInputComErro = null;

    limparErrosCadastro();

    if (nomeVar === '') {
      exibirErroCampo(nomeInput, 'Preencha o nome de usuário.');
      formularioValido = false;
      primeiroInputComErro = primeiroInputComErro || nomeInput;
    } else if (nomeVar.length < 3) {
      exibirErroCampo(nomeInput, 'O nome deve ter pelo menos 3 caracteres.');
      formularioValido = false;
      primeiroInputComErro = primeiroInputComErro || nomeInput;
    }

    if (emailVar === '') {
      exibirErroCampo(emailInput, 'Preencha o e-mail.');
      formularioValido = false;
      primeiroInputComErro = primeiroInputComErro || emailInput;
    } else if (!emailValido(emailVar)) {
      exibirErroCampo(emailInput, 'Digite um e-mail válido. Ex: nome@dominio.com');
      formularioValido = false;
      primeiroInputComErro = primeiroInputComErro || emailInput;
    }

    if (senhaVar === '') {
      exibirErroCampo(senhaInput, 'Preencha a senha.');
      formularioValido = false;
      primeiroInputComErro = primeiroInputComErro || senhaInput;
    } else {
      const senhaTemMaiuscula = /[A-Z]/.test(senhaVar);
      const senhaTemMinuscula = /[a-z]/.test(senhaVar);
      const senhaTemNumero = /\d/.test(senhaVar);
      const senhaTemCaracterEspecial = /[!@#$%^&*()_\-+=\[\]{};:'",.<>/?\\|`~]/.test(senhaVar);
      const senhaTemAcento = /[áàâãéêíóôõúüçÁÀÂÃÉÊÍÓÔÕÚÜÇ]/.test(senhaVar);
      const senhaTemEspaco = /\s/.test(senhaVar);

      if (senhaVar.length < 8) {
        exibirErroCampo(senhaInput, 'A senha deve ter pelo menos 8 caracteres.');
        formularioValido = false;
        primeiroInputComErro = primeiroInputComErro || senhaInput;
      } else if (!senhaTemMaiuscula || !senhaTemMinuscula) {
        exibirErroCampo(senhaInput, 'A senha deve possuir letras maiúsculas e minúsculas.');
        formularioValido = false;
        primeiroInputComErro = primeiroInputComErro || senhaInput;
      } else if (!senhaTemNumero) {
        exibirErroCampo(senhaInput, 'A senha deve possuir pelo menos um número.');
        formularioValido = false;
        primeiroInputComErro = primeiroInputComErro || senhaInput;
      } else if (senhaTemAcento) {
        exibirErroCampo(senhaInput, 'A senha não pode possuir acentos.');
        formularioValido = false;
        primeiroInputComErro = primeiroInputComErro || senhaInput;
      } else if (senhaTemEspaco) {
        exibirErroCampo(senhaInput, 'A senha não pode possuir espaços.');
        formularioValido = false;
        primeiroInputComErro = primeiroInputComErro || senhaInput;
      } else if (!senhaTemCaracterEspecial) {
        exibirErroCampo(senhaInput, 'A senha deve possuir pelo menos um caractere especial.');
        formularioValido = false;
        primeiroInputComErro = primeiroInputComErro || senhaInput;
      }
    }

    if (confirmacaoSenhaVar === '') {
      exibirErroCampo(confirmarSenhaInput, 'Confirme a senha.');
      formularioValido = false;
      primeiroInputComErro = primeiroInputComErro || confirmarSenhaInput;
    } else if (senhaVar !== confirmacaoSenhaVar) {
      exibirErroCampo(confirmarSenhaInput, 'As senhas digitadas devem ser iguais.');
      formularioValido = false;
      primeiroInputComErro = primeiroInputComErro || confirmarSenhaInput;
    }

    if (!formularioValido) {
      if (primeiroInputComErro) {
        primeiroInputComErro.focus();
      }
      return false;
    }

    const popup = document.createElement('div');
    popup.classList.add('confirmation-popup');

    setTimeout(() => {
      popup.remove();
    }, 1800);

      // Enviando o valor da nova input
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            message = 'Você será redirecionado à tela de login.';
            popup.innerHTML = `<div>${message}</div>`;
            document.body.appendChild(popup);

            setTimeout(() => {
              window.location = "login.html";
            }, "2000");

            limparFormulario('cadastro');
            finalizarAguardar();
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
          finalizarAguardar();
        });

    return false;
  }

</script>
