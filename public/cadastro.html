<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsychoAssociation | Cadastro</title>
  <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
  <div class="left-container">
    <div class="content">
      <div class="texts">
        <h2>SEJA BEM-VINDO</h2>
        <h3>FAÇA PARTE DA ORGANIZAÇÃO</h3>
      </div>
      <form>
        <div class="input-container">
          <label for="ipt_name">Nome do usuário</label>
          <input type="text" id="ipt_name" placeholder="Insira seu nome de usuário">
        </div>
        <div class="input-container">
          <label for="ipt_name">Email</label>
          <input type="text" id="ipt_email" placeholder="Insira seu endereço de email">
        </div>
        <div class="input-container">
          <label for="ipt_name">Senha</label>
          <input type="text" id="ipt_senha" placeholder="Insira sua senha">
        </div>
        <div class="input-container">
          <label for="ipt_name">Confirmar senha</label>
          <input type="text" id="ipt_senha_confirmada" placeholder="Insira sua senha novamente">
        </div>
        <button onclick="cadastrar()">CADASTRAR-SE</button>
      </form>
      <p>Já tem uma conta? <span>Faça login</span></p>
    </div>
  </div>
  <div class="image">

  </div>
  <div class="right-container">

  </div>
</body>

</html>
