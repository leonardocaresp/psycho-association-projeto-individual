<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsychoAssociation | Cadastro</title>
  <link rel="stylesheet" href="css/cadastro.css">
  <script src="./js/sessao.js"></script>
  <script src="./js/funcoes.js"></script>
  <link rel="icon" type="image/x-icon" href="assets/icon/psycho-association-logo.svg">
</head>

<body>
  <div class="image">
    <a href="index.html"><img src="assets/icon/psycho-association-outline-roxo.svg"></a>
  </div>
  <div class="left-container">
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
    <div class="content">
      <div class="texts">
        <h2>SEJA BEM-VINDO</h2>
        <h3>FAÇA PARTE DA ORGANIZAÇÃO</h3>
      </div>
      <div class="form-container">
        <div class="input-container">
          <label for="ipt_name">Nome do usuário</label>
          <input type="text" id="ipt_name" placeholder="Insira seu nome de usuário">
        </div>
        <div class="input-container">
          <label for="ipt_email">Email</label>
          <input type="text" id="ipt_email" placeholder="Insira seu endereço de email">
        </div>
        <div class="input-container">
          <label for="ipt_password">Senha</label>
          <input type="text" id="ipt_password" placeholder="Insira sua senha">
        </div>
        <div class="input-container">
          <label for="ipt_password_confirmed">Confirmar senha</label>
          <input type="text" id="ipt_password_confirmed" placeholder="Insira sua senha novamente">
        </div>
        <button onclick="cadastrar()">CADASTRAR-SE</button>
      </div>
      <p>Já tem uma conta? <a href="login.html"><span>Faça login</span></a></p>
    </div>
  </div>
  <div class="right-container">
  </div>
</body>

</html>

<script>
  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = ipt_name.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_password.value;
    var confirmacaoSenhaVar = ipt_password_confirmed.value;

    let message = ''

    let popup = document.createElement('div')
    popup.classList.add('confirmation-popup')
    setTimeout(() => {
      popup.remove()
    }, 1800)

    //Validações de senha
    let senhaTemMaiuscula = senhaVar != senhaVar.toLowerCase()
    let senhaTemMinúscula = senhaVar != senhaVar.toUpperCase()

    let senhaTemNúmero = false
    let senhaTemCaracterEspecial = false
    let senhaTemAcento = false

    const caracteresEspeciais = [
      '!', '@', '#', '$', '%', '¨', '&', '*', '(', ')', '-', '_', '+', '=',
      '´', '`', '{', '}', '[', ']', '^', '~', '<', '>', ',', '.', ':', ';',
      '/', '?', '\\', '|', '"', "'", '§', 'ª', 'º', '°', '£', '¢', '¬', '³', '²', '¹'
    ];

    const caracteresAcentuados = [
      'á', 'à', 'â', 'ã', 'é', 'ê', 'í', 'ó', 'ô', 'õ', 'ú', 'ü', 'ç',
      'Á', 'À', 'Â', 'Ã', 'É', 'Ê', 'Í', 'Ó', 'Ô', 'Õ', 'Ú', 'Ü', 'Ç'
    ];

    let senhaTemEspaço = senhaVar.includes(' ')


    for (let i = 0; i < senhaVar.length; i++) {
      for (let j = 0; j < 10; j++) {
        if (senhaVar[i] == j) {
          senhaTemNúmero = true
        }

        if (senhaVar[i] == caracteresEspeciais[j]) {
          senhaTemCaracterEspecial = true
        }

        if (senhaVar[i] == caracteresAcentuados[j]) {
          senhaTemAcento = true
        }

      }
    }

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {

      message = 'Preencha todos os campos!'
      popup.innerHTML = `<div>${message}</div>`
      document.body.appendChild(popup)

      finalizarAguardar();
      return false;

    } else if (senhaVar != confirmacaoSenhaVar) {
      
      let input = document.getElementById('ipt_password')
      message = 'As senhas digitadas devem ser iguais!'
      input.classList.add('error')
      input.focus()
      input.parentElement.innerHTML += `<span style="color: red;">${message}</span>`

      finalizarAguardar();
      return false;

    } else if (!senhaTemMaiuscula || !senhaTemMinúscula) {

      message = 'Sua senha deve possuir letras maíusculas e minúsculas!'
      popup.innerHTML = `<div>${message}</div>`
      document.body.appendChild(popup)

      finalizarAguardar();
      return false;

    } else if (!senhaTemNúmero) {

      message = 'Sua senha deve possuir pelo menos um número!'
      popup.innerHTML = `<div>${message}</div>`
      document.body.appendChild(popup)

      finalizarAguardar();
      return false;

    } else if (senhaTemAcento) {

      message = 'Sua senha NÃO pode possuir acento!'
      popup.innerHTML = `<div>${message}</div>`
      document.body.appendChild(popup)

      finalizarAguardar();
      return false;

    } else if (senhaTemEspaço) {

      message = 'Sua senha NÃO pode possuir espaços!'
      popup.innerHTML = `<div>${message}</div>`
      document.body.appendChild(popup)

      finalizarAguardar();
      return false;

    } else if (!senhaTemCaracterEspecial) {

      message = 'Sua senha deve possuir pelo menos um caracter especial!'
      popup.innerHTML = `<div>${message}</div>`
      document.body.appendChild(popup)

      finalizarAguardar();
      return false;

    }

      // Enviando o valor da nova input
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            message = 'Você será redirecionado à tela de login.'
            popup.innerHTML = `<div>${message}</div>`
            document.body.appendChild(popup)

            setTimeout(() => {
              window.location = "login.html";
            }, "2000");

            limparFormulario('cadastro');
            finalizarAguardar();
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
          finalizarAguardar();
        });

    return false;
  }

</script>
