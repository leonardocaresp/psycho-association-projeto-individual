</head>

    <div class="user-info">

  <nav>
    <button class="close-nav" onclick="fecharNav()">

      <span>PAINEL DE CONTROLE</span>

    </div>
    <div class="nav-button" onclick="window.location = 'ocorrencias.html'">
      <span>OCORRÊNCIAS</span>
     <span><i class="material-icons">view_comfy</i></span>
    </div>

      <span>ARQUIVO DE INDIVÍDUOS</span>
      <span><i class="material-icons"">group</i></span>

    <div class="nav-button" onclick="window.location = 'quiz.html'">

    <button class="disconnect" onclick="limparSessao()">
      DESCONECTAR
    </button>
  </nav>

  <main>
    <div class="top-container">
      <div>
        <h2>ARQUIVO DE INDIVÍDUOS</h2>
        <h3>Consulte os registros de indivíduos conhecidos pela organização. Humanos, paranormais e entidades espirituais. Todos devidamente documentados.</h3>
      </div>
      <div>
        <button class="left-button" onclick="voltarPaginaParanormais()"><img src="../assets/icon/left-arrow.svg"></button>
        <span id="span_paginacao_paranormais"></span>
        <button class="right-button" onclick="avancarPaginaParanormais()"><img src="../assets/icon/right-arrow.svg"></button>
      </div>
    </div>
    <div class="bottom-container">
    </div>
  </main>
</body>

</html>
<script>
  const personagensParanormais = [
    {
      nome: 'ARATAKA REIGEN',
      tipo: 'Paranormal',
      descricao: 'Fundador e atual responsável pela Psycho Association, Reigen é um especialista em fenômenos paranormais e um excelente negociador. Com habilidades excepcionais de comunicação, sabe lidar com clientes, situações complicadas e, principalmente, com a administração da organização. Sua experiência é inquestionável. Seus métodos, nem sempre.',
      imagem: '../assets/imgs/arataka-reigen-vertical-image.jfif',
      alt: 'Arataka Reigen'
    },
    {
      nome: 'SHIGEO KAGEYAMA',
      tipo: 'Paranormal',
      descricao: 'Conhecido como Mob, Shigeo é um jovem de poucas palavras e um potencial psíquico extraordinário. Sua capacidade de canalizar enormes quantidades de energia paranormal faz dele um dos principais agentes de campo da organização. Apesar de seu poder impressionante, prefere evitar conflitos e levar uma vida tranquila. Recomendamos não testar seus limites emocionais.',
      imagem: '../assets/imgs/Gemini_Generated_Image_cseoshcseoshcseo.jfif',
      alt: 'Shigeo Kageyama'
    },
    {
      nome: 'TERUKI HANAZAWA',
      tipo: 'Paranormal',
      descricao: 'Também conhecido como Teru, Hanazawa é um paranormal habilidoso que possui excelente controle sobre suas capacidades psíquicas. Sua experiência em confrontos sobrenaturais e sua versatilidade no uso da telecinese fazem dele um dos agentes mais preparados para situações de risco. Possui bastante confiança em suas habilidades. Às vezes, até demais.',
      imagem: '../assets/imgs/teruki-hanazawa-vertical-image.jfif',
      alt: 'Teruki Hanazawa'
    },
    {
      nome: 'RITSU KAGEYAMA',
      tipo: 'Paranormal',
      descricao: 'Irmão mais novo de Shigeo, Ritsu é um estudante extremamente inteligente e disciplinado, com habilidades psíquicas próprias. Sua capacidade analítica e facilidade para compreender fenômenos complexos fazem dele um importante membro da equipe de investigação. Embora inicialmente tenha demonstrado interesse em superar o irmão, hoje utiliza suas habilidades para objetivos mais construtivos.',
      imagem: '../assets/imgs/ritsu-kageyama-vertical-image.jfif',
      alt: 'Ritsu Kageyama'
    },
    {
      nome: 'COVINHAS',
      tipo: 'Espírito',
      descricao: 'Uma entidade espiritual de personalidade excêntrica e ambições questionáveis. Após inúmeras experiências no mundo dos vivos, Covinhas passou a colaborar com a organização, oferecendo conhecimentos sobre espíritos, possessões e manifestações sobrenaturais. Apesar de sua aparência peculiar, é um recurso valioso para investigações envolvendo outras entidades. Não aceite conselhos sobre dominação mundial.',
      imagem: '../assets/imgs/covinhas-imagem.webp',
      alt: 'Covinhas'
    }
  ];

  let paginaAtualParanormais = 1;
  let totalPaginasParanormais = 1;
  const cardsPorPagina = 5;

  function renderizarCardsParanormais(personagens) {
    const containerCards = document.querySelector('.bottom-container');

    let htmlCards = '';

    for (let i = 0; i < personagens.length; i++) {
      const personagem = personagens[i];

      htmlCards += `
        <div class="paranormal-card">
          <div class="character-name">
            ${personagem.nome}
          </div>
          <div class="overlay">
            <h3>${personagem.tipo}</h3>
            <h2>${personagem.nome}</h2>
            <div class="desc">
              <p>${personagem.descricao}</p>
            </div>
          </div>
          <img src="${personagem.imagem}" alt="${personagem.alt}">
        </div>
      `;
    }

    containerCards.innerHTML = htmlCards;
  }

  function inicializarParanormais() {
    if (personagensParanormais.length === 0) {
      totalPaginasParanormais = 1;
      renderizarPaginaParanormais();
      return;
    }

    totalPaginasParanormais = Math.ceil(personagensParanormais.length / cardsPorPagina);
    paginaAtualParanormais = 1;

    renderizarPaginaParanormais();
  }

  function renderizarPaginaParanormais() {
    const indiceInicial = (paginaAtualParanormais - 1) * cardsPorPagina;
    const indiceFinal = indiceInicial + cardsPorPagina;
    const personagensDaPagina = personagensParanormais.slice(indiceInicial, indiceFinal);

    renderizarCardsParanormais(personagensDaPagina);

    const spanPaginacao = document.getElementById('span_paginacao_paranormais');
    spanPaginacao.innerText = `${paginaAtualParanormais}/${totalPaginasParanormais}`;
  }

  function avancarPaginaParanormais() {
    if (paginaAtualParanormais < totalPaginasParanormais) {
      paginaAtualParanormais = paginaAtualParanormais + 1;
      renderizarPaginaParanormais();
    }
  }

  function voltarPaginaParanormais() {
    if (paginaAtualParanormais > 1) {
      paginaAtualParanormais = paginaAtualParanormais - 1;
      renderizarPaginaParanormais();
    }
  }
</script>
