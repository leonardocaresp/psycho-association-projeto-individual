<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsychoAssociation | Relatórios</title>
  <link rel="stylesheet" href="../css/painel.css">
  <script src="../js/funcoes.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>

<body>
  <nav>
    <div class="user-info">
      <span class="user-name">Leonardo Cardoso</span>
      <span class="user-email">leo@gmail.com</span>
      <span class="user-level">Nível 1</span>
    </div>
    <div class="nav-button" onclick="window.location = 'paranormais.html'">
      <span>PARANORMAIS</span>
    </div>
    <div class="nav-button" onclick="window.location = 'quiz.html'">
      <span>QUIZ</span>
    </div>
    <div class="nav-button" onclick="window.location = 'ocorrencias.html'">
      <span>OCORRÊNCIAS</span>
    </div>
    <div class="nav-button selected">
      <span>PAINEL</span>
    </div>
    <button onclick="trocarTela('../index.html')">
      DESCONECTAR
    </button>
  </nav>

  <main>
    <div class="top-container">
      <h2>PAINEL GERAL</h2>
    </div>

    <div class="dashboard-container">

      <div class="kpi-row">

        <div class="kpi">
          <div class="top">
            CASOS ABERTOS
          </div>
          <div class="bottom">
            24
          </div>
        </div>

        <div class="kpi">
          <div class="top">
            EM INVESTIGAÇÃO
          </div>
          <div class="bottom">
            11
          </div>
        </div>

        <div class="kpi">
          <div class="top">
            RESOLVIDOS
          </div>
          <div class="bottom">
            9
          </div>
        </div>

        <div class="kpi">
          <div class="top">
            SEM EXPLICAÇÃO
          </div>
          <div class="bottom">
            4
          </div>
        </div>

      </div>

      <div class="charts-row">

        <div class="chart">
          <div class="top">
            OCORRÊNCIAS POR TIPO
          </div>
          <div class="bottom">
            <canvas id="myChart" height="540"></canvas>
          </div>
        </div>

        <div class="chart">
          <div class="top">
            STATUS DOS CASOS
          </div>
          <div class="bottom">
            <div style="position: relative; height: 30%;">
              <canvas id="graficoStatus"></canvas>
            </div>  
            <div class="status-metrics">
              <div class="metric">
                <div class="orange square"></div>
                EM INVESTIGAÇÃO - 46%
              </div>

              <div class="metric">
                <div class="green square"></div>
                RESOLVIDOS - 38%
              </div>

              <div class="metric">
                <div class="red square"></div>
                SEM EXPLICAÇÃO - 16%
              </div>
            </div>
            
          </div>
        </div>
        

        <div class="chart">
          <div class="top">
            PERFIS DO QUIZ
          </div>
          <div class="bottom">

          </div>
        </div>

      </div>
    </div>



  </main>
</body>

</html>
<script>
  const ctx = document.getElementById('myChart');

   new Chart(ctx, {
    type: 'bar',
    plugins: [ChartDataLabels], // ativa o plugin dos números
    data: {
      labels: [
        ['PODERES', 'PSÍQUICOS'],
        'ESPÍRITOS',
        ['LOCAIS', 'ASSOMBRADOS'],
        'SEITAS'
      ],
      datasets: [{
        data: [10, 7, 5, 2],
        backgroundColor: ['#D250FF', '#3FE275', '#00DEAF', '#FDB123'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false // remove os retângulos coloridos
        },
        datalabels: {
          anchor: 'end', // gruda no topo da barra
          align: 'end',  // fica para fora, acima da barra
          color: '#0A0D22',
          font: {
            size: 16,
            weight: 'bold'
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },   // sem linhas verticais
          border: { display: false }, // sem a linha do eixo X
          ticks: {
            maxRotation: 0,
            minRotation: 0
          }
        },
        y: {
          display: false, // esconde o eixo Y e as linhas horizontais
          beginAtZero: true,
          grace: '10%'    // folga no topo para o número caber
        }
      }
    }
  });

  const ctx2 = document.getElementById('graficoStatus')

  new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['EM INVESTIGAÇÃO', 'RESOLVIDOS', 'SEM EXPLICAÇÃO'],
      datasets: [{
        data: [11, 9, 4],
        backgroundColor: ['#FD7D23', '#3FE275', '#E23235'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '55%',
      plugins: {
        legend: { display: false }
      }
    }
  });

</script>
