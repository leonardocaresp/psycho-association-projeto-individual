<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsychoAssociation | Relatórios</title>
  <link rel="stylesheet" href="../css/ocorrencias.css">
  <script src="../js/funcoes.js"></script>
  <script src="../js/sessao.js"></script>


  <link rel="icon" type="image/x-icon" href="../assets/icon/psycho-association-logo.svg">

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>

<body onload="apagarCarregamento(); validarSessao(); inicializarOcorrencias();">
  <header>
    <div class="icon">
      <img src="../assets/icon/psycho-association-logo.svg">
    </div>
    <div class="user-info">
      <span class="user-name" id="b_usuario"></span>
      <span class="user-email" id="e_usuario"></span>
    </div>
  </header>
  <nav>
    <button class="close-nav" onclick="fecharNav()">
      <
    </button>
    <div class="nav-button" onclick="window.location = 'dashboard.html'">
      <span>PAINEL DE CONTROLE</span>
      <span><i class="material-icons">dashboard</i></span>
    </div>
    <div class="nav-button selected">
      <span>OCORRÊNCIAS</span>
     <span><i class="material-icons">view_comfy</i></span>
    </div>
    <div class="nav-button" onclick="window.location = 'paranormais.html'">
      <span>ARQUIVO DE INDIVÍDUOS</span>
      <span><i class="material-icons"">group</i></span>
    </div>
    <div class="nav-button" onclick="window.location = 'quiz.html'">
      <span>EXAME DE APTIDÃO</span>
      <span><i class="material-icons">quiz</i></span>
    </div>

    <button class="disconnect" onclick="limparSessao()">
      DESCONECTAR
    </button>
  </nav>

  <main>
    <div class="top-container">
      <div>
          <h2>CENTRAL DE OCORRÊNCIAS</h2>
          <h3>Consulte os registros da organização ou documente novos fenômenos identificados durante suas investigações.</h3>
      </div>
      <div>
        <button onclick="abrirPopup()">+ NOVA OCORRÊNCIA</button>
      </div>
    </div>
    <div class="bottom-container">

      <div class="ocorrencias-filter">
        <div class="search-bar">
          <input id="ipt_search_ocorrencia" type="search" placeholder="Pesquise um caso">
          <i class="material-icons">search</i>
        </div>
        <select id="select_filter_classificacao" name="classificacao">
          <option value="">Todas classificações</option>
          <option value="Poderes psíquicos">Poderes psíquicos</option>
          <option value="Entidades espirituais">Entidades espirituais</option>
          <option value="Locais assombrados">Locais assombrados</option>
          <option value="Seitas paranormais">Seitas paranormais</option>
        </select>
        <select name="status" id="select_filter_status">
          <option value="">Todos status</option>
          <option value="Em investigação">Em investigação</option>
          <option value="Resolvido">Resolvido</option>
          <option value="Sem explicação">Sem explicação</option>
        </select>
      </div>
      
      <div class="ocorrencias-container" id="ocorrencias_container"></div>
    </div>

    
  </main>
</body>

</html>
<script>
  const opcoesClassificacao = [
    'Poderes psíquicos',
    'Entidades espirituais',
    'Locais assombrados',
    'Seitas paranormais'
  ];

  const opcoesStatus = [
    'Em investigação',
    'Resolvido',
    'Sem explicação'
  ];

  let ocorrencias = [];
  let idOcorrenciaEditando = null;
  let inputBusca = null;
  let selectClassificacaoFiltro = null;
  let selectStatusFiltro = null;

  function inicializarOcorrencias() {
    inputBusca = document.getElementById('ipt_search_ocorrencia');
    selectClassificacaoFiltro = document.getElementById('select_filter_classificacao');
    selectStatusFiltro = document.getElementById('select_filter_status');

    inputBusca.addEventListener('input', aplicarFiltros);
    selectClassificacaoFiltro.addEventListener('change', aplicarFiltros);
    selectStatusFiltro.addEventListener('change', aplicarFiltros);

    listarOcorrencias();
  }

  function listarOcorrencias() {
    fetch('/ocorrencias/listar')
      .then(function (resposta) {
        if (resposta.status == 204) {
          ocorrencias = [];
          renderizarOcorrencias([]);
          return;
        }

        if (!resposta.ok) {
          throw 'Erro ao listar ocorrências';
        }

        resposta.json().then(function (dados) {
          ocorrencias = dados;
          aplicarFiltros();
        });
      })
      .catch(function (erro) {
        console.log('#ERRO:', erro);
      });
  }

  function aplicarFiltros() {
    const textoBusca = normalizarTexto(inputBusca.value.trim());
    const classificacaoSelecionada = selectClassificacaoFiltro.value;
    const statusSelecionado = selectStatusFiltro.value;

    const listaFiltrada = ocorrencias.filter(function (ocorrencia) {
      const textoCompleto = normalizarTexto(`${ocorrencia.titulo} ${ocorrencia.local} ${ocorrencia.descricao} ${ocorrencia.nomeUsuario}`);

      const passouBusca = textoCompleto.includes(textoBusca);
      const passouClassificacao = classificacaoSelecionada === '' || ocorrencia.classificacao === classificacaoSelecionada;
      const passouStatus = statusSelecionado === '' || normalizarTexto(ocorrencia.status).includes(normalizarTexto(statusSelecionado));

      return passouBusca && passouClassificacao && passouStatus;
    });

    renderizarOcorrencias(listaFiltrada);
  }

  function renderizarOcorrencias(lista) {
    const container = document.getElementById('ocorrencias_container');
    container.innerHTML = '';

    if (lista.length === 0) {
      container.innerHTML = '<p class="empty-message">Nenhuma ocorrência encontrada.</p>';
      return;
    }

    for (let i = 0; i < lista.length; i++) {
      const ocorrencia = lista[i];
      const card = document.createElement('div');
      card.className = 'ocorrencia-card';

      const classeTipo = obterClasseTipo(ocorrencia.classificacao);
      const classeStatus = obterClasseStatus(ocorrencia.status);

      card.innerHTML = `
        <div class="left">
          <div class="text">
            <h4>Caso #${ocorrencia.idOcorrencia}</h4>
            <p>Registrado por: <span>${escapeHtml(ocorrencia.nomeUsuario)}</span></p>
            <h2>${escapeHtml(ocorrencia.titulo)} - <span>${escapeHtml(ocorrencia.local)}</span></h2>
          </div>

          <div class="info">
            <div class="type ${classeTipo}">
              ${escapeHtml(ocorrencia.classificacao).toUpperCase()}
            </div>
            <div class="status ${classeStatus}">
              ${escapeHtml(ocorrencia.status).toUpperCase()}
            </div>
          </div>

          <details>
            <summary>Mais detalhes</summary>
            <p>${escapeHtml(ocorrencia.descricao)}</p>
          </details>
        </div>
        <div class="right">
          <button class="editar" onclick="abrirPopup(${ocorrencia.idOcorrencia})">EDITAR</button>
          <button class="excluir" onclick="excluirOcorrencia(${ocorrencia.idOcorrencia})">EXCLUIR</button>
        </div>
      `;

      container.appendChild(card);
    }
  }

  function abrirPopup(idOcorrencia = null) {
    fecharPopup();

    idOcorrenciaEditando = idOcorrencia;
    const editando = idOcorrencia !== null;

    let ocorrenciaAtual = null;
    if (editando) {
      ocorrenciaAtual = ocorrencias.find(function (item) {
        return item.idOcorrencia === idOcorrencia;
      });

      if (!ocorrenciaAtual) {
        alert('Ocorrência não encontrada. Atualize a página e tente novamente.');
        return;
      }
    }

    const popup = document.createElement('div');
    popup.classList.add('popup-container');

    let tituloPopup = 'ABRIR OCORRÊNCIA';
    let subtituloPopup = 'REGISTRE UM CASO';
    let textoBotaoSalvar = 'SALVAR OCORRÊNCIA';
    let valorTitulo = '';
    let valorClassificacao = '';
    let valorStatus = '';
    let valorLocal = '';
    let valorDescricao = '';

    if (editando) {
      tituloPopup = 'EDITAR OCORRÊNCIA';
      subtituloPopup = 'ATUALIZE O CASO';
      textoBotaoSalvar = 'ATUALIZAR OCORRÊNCIA';
    }

    if (editando && ocorrenciaAtual) {
      valorTitulo = escapeHtml(ocorrenciaAtual.titulo);
      valorClassificacao = ocorrenciaAtual.classificacao;
      valorStatus = ocorrenciaAtual.status;
      valorLocal = escapeHtml(ocorrenciaAtual.local);
      valorDescricao = escapeHtml(ocorrenciaAtual.descricao);
    }

    popup.innerHTML = `
      <div class="popup">
        <div class="text">
          <h2>${tituloPopup}</h2>
          <h3>${subtituloPopup}</h3>
        </div>
        <div class="form">
          <div class="input-container">
            <label for="ipt_title">Título</label>
            <input maxlength="55" type="text" id="ipt_title" placeholder="Insira o título da ocorrência" value="${valorTitulo}">
          </div>

          <div class="selects">
            <div class="input-container">
              <label for="select_type_popup">Classificação</label>
              <select id="select_type_popup">
                ${gerarOpcoesSelect(opcoesClassificacao, 'Selecione o tipo de evento', valorClassificacao)}
              </select>
            </div>

            <div class="input-container">
              <label for="select_status_popup">Status</label>
              <select id="select_status_popup">
                ${gerarOpcoesSelect(opcoesStatus, 'Selecione o status atual da investigação', valorStatus)}
              </select>
            </div>
          </div>

          <div class="input-container">
            <label for="ipt_place">Local</label>
            <input maxlength="100" type="text" id="ipt_place" placeholder="Insira o local do ocorrido" value="${valorLocal}">
          </div>

          <div class="input-container">
            <label for="ipt_desc">Descrição</label>
            <input maxlength="500" class="desc" type="text" id="ipt_desc" placeholder="Informe mais detalhes sobre o relatório" value="${valorDescricao}">
          </div>

          <div class="buttons">
            <button class="salvar" onclick="salvarOcorrencia()">${textoBotaoSalvar}</button>
            <button class="cancelar" onclick="fecharPopup()">CANCELAR</button>
          </div>
        </div>
      </div>
    `;

    document.body.appendChild(popup);
  }

  function fecharPopup() {
    const popup = document.querySelector('.popup-container');
    if (popup) {
      popup.remove();
    }
    idOcorrenciaEditando = null;
  }

  function salvarOcorrencia() {
    const titulo = document.getElementById('ipt_title').value.trim();
    const classificacao = document.getElementById('select_type_popup').value;
    const status = document.getElementById('select_status_popup').value;
    const local = document.getElementById('ipt_place').value.trim();
    const descricao = document.getElementById('ipt_desc').value.trim();

    if (titulo === '' || classificacao === '' || status === '' || local === '' || descricao === '') {
      alert('Preencha todos os campos da ocorrência.');
      return;
    }

    const idUsuario = sessionStorage.ID_USUARIO;
    if (!idUsuario) {
      alert('Usuário não identificado. Faça login novamente.');
      return;
    }

    const corpo = {
      titulo: titulo,
      classificacao: classificacao,
      status: status,
      local: local,
      descricao: descricao
    };

    const editando = idOcorrenciaEditando !== null;
    let endpoint = `/ocorrencias/publicar/${idUsuario}`;
    let metodo = 'POST';

    if (editando) {
      endpoint = `/ocorrencias/editar/${idOcorrenciaEditando}`;
      metodo = 'PUT';
    }

    fetch(endpoint, {
      method: metodo,
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(corpo)
    })
      .then(function (resposta) {
        if (resposta.ok) {
          fecharPopup();
          listarOcorrencias();
        } else {
          throw 'Erro ao salvar ocorrência';
        }
      })
      .catch(function (erro) {
        console.log('#ERRO:', erro);
        alert('Não foi possível salvar a ocorrência.');
      });
  }

  function excluirOcorrencia(idOcorrencia) {
    const confirmou = confirm('Deseja realmente excluir essa ocorrência?');
    if (!confirmou) {
      return;
    }

    fetch(`/ocorrencias/deletar/${idOcorrencia}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      }
    })
      .then(function (resposta) {
        if (resposta.ok) {
          listarOcorrencias();
        } else {
          throw 'Erro ao excluir ocorrência';
        }
      })
      .catch(function (erro) {
        console.log('#ERRO:', erro);
        alert('Não foi possível excluir a ocorrência.');
      });
  }

  function gerarOpcoesSelect(opcoes, placeholder, valorSelecionado) {
    let atributoSelecionadoPlaceholder = 'selected';
    if (valorSelecionado) {
      atributoSelecionadoPlaceholder = '';
    }

    let opcoesHtml = `<option value="" disabled ${atributoSelecionadoPlaceholder}>${placeholder}</option>`;

    for (let i = 0; i < opcoes.length; i++) {
      const opcao = opcoes[i];
      let selecionado = '';
      if (valorSelecionado === opcao) {
        selecionado = 'selected';
      }

      opcoesHtml += `<option value="${opcao}" ${selecionado}>${opcao}</option>`;
    }

    return opcoesHtml;
  }

  function obterClasseTipo(classificacao) {
    if (classificacao === 'Entidades espirituais') {
      return 'pink-bkg';
    }

    if (classificacao === 'Locais assombrados') {
      return 'yellow-bkg';
    }

    if (classificacao === 'Seitas paranormais') {
      return 'green-bkg';
    }

    return 'purple-bkg';
  }

  function obterClasseStatus(status) {
    const statusNormalizado = normalizarTexto(status);

    if (statusNormalizado.includes('investig')) {
      return 'em-andamento';
    }

    if (statusNormalizado.includes('resolvid')) {
      return 'resolvido';
    }

    return 'sem-explicacao';
  }

  function normalizarTexto(texto) {
    return (texto || '')
      .toString()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function escapeHtml(texto) {
    return (texto || '')
      .toString()
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
